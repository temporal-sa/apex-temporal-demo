services:
  postgresql:
    image: postgres:16
    container_name: temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5432:5432"
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.27
    container_name: temporal-server
    depends_on:
      - postgresql
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8233:8080"

  # Optional: ships worker metrics to Grafana Cloud. Start with
  # `python scripts/render_prometheus.py && docker compose --profile metrics up -d`
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: temporal-prometheus
    profiles: ["metrics"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9091:9090"

  # Optional: Floci, a local AWS emulator for the `local` target. Start with
  # `docker compose --profile local up -d floci`. It runs EC2 instances as
  # sibling containers, so it needs the Docker socket (and root to use it).
  floci:
    image: floci/floci:2.2.0
    container_name: apex-floci
    profiles: ["local"]
    user: root
    environment:
      # Keep emulated resources and Terraform state across Floci restarts.
      - FLOCI_STORAGE_MODE=persistent
      - FLOCI_STORAGE_PERSISTENT_PATH=/app/data
      # Pin the port-forward sidecar: without a tag, Floci pulls every tag.
      - FLOCI_SERVICES_EC2_SOCAT_IMAGE=alpine/socat:1.8.1.3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    ports:
      - "4566:4566"

volumes:
  temporal-postgres-data:
  floci-data:
